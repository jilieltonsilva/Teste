<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07162d"><title>Central de Formulários</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');:root{--n:#07162d;--b:#4f7cff;--v:#8b5cf6;--bg:#eef3f9;--t:#17233a;--m:#69768b;--l:#dbe4ef;--card:#ffffff;--radius:14px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#d9e9ff 0,transparent 30%),var(--bg);font-family:Manrope,Segoe UI,Arial;color:var(--t)}.hero{background:linear-gradient(125deg,var(--n),#173b72);color:#fff;padding:28px 20px 72px}.hero>div,.wrap{max-width:820px;margin:auto}.hero h1{margin:0 0 8px;font-size:clamp(28px,7vw,42px)}.hero p{margin:0;color:#c8d5e8}.wrap{margin-top:-42px;padding:0 14px 28px}.card{background:var(--card);border-radius:calc(var(--radius) + 10px);box-shadow:0 18px 55px #0f23461f;overflow:hidden;padding:22px}.selector-title{margin:0 0 5px}.selector-sub{margin:0 0 18px;color:var(--m);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.folder-choice{grid-column:1/-1;border:1px solid var(--l);border-radius:17px;background:#f7f9fc;overflow:hidden}.folder-choice summary{padding:14px 16px;font-weight:800;cursor:pointer}.folder-choice .form-grid{padding:0 12px 12px}.loose-title{grid-column:1/-1;margin:8px 0 0;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.form-choice{border:1px solid var(--l);background:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer}.form-choice:hover{border-color:var(--b);transform:translateY(-2px)}.form-choice strong{display:block;font-size:15px}.form-choice span{display:block;color:var(--m);font-size:11px;margin-top:6px;line-height:1.45}.back-home{border:0;background:#edf2f7;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:16px}.progress{height:7px;background:#e8edf4;border-radius:999px;margin-bottom:15px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--v))}.screen{display:none}.screen.active{display:block}.section-title{margin:0 0 5px}.desc{margin:0 0 18px;color:var(--m);font-size:13px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field>label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#526078;font-weight:800}input,select,textarea{width:100%;min-height:48px;border:1px solid var(--l);border-radius:14px;padding:12px 14px;background:#fff;font:inherit;font-size:16px}textarea{min-height:120px}.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--l);padding:10px;border-radius:11px;margin-bottom:6px}.opt input{width:20px;min-height:20px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.actions button{min-height:49px;border:0;border-radius:14px;padding:11px 17px;font:inherit;font-weight:800}.primary{background:linear-gradient(135deg,var(--b),var(--v));color:#fff}.secondary{background:#edf2f7;color:#46536a}.counter{text-align:center;color:var(--m);font-size:11px;margin-bottom:10px}.status{display:none;margin-top:12px;padding:11px;border-radius:11px}.ok{display:block;background:#e3f8ef;color:#0c704b}.warn{display:block;background:#fff6dc;color:#7b5c00}.error{display:block;background:#fff0f2;color:#b62c3d}@media(max-width:620px){.form-grid{grid-template-columns:1fr}.wrap{padding:0}.card{border-radius:24px 24px 0 0;min-height:65vh}.actions button{flex:1}}</style></head><body><header class="hero"><div><h1>Central de Formulários</h1><p>Escolha abaixo o formulário que deseja responder.</p></div></header><main class="wrap"><section id="app" class="card"></section></main><script>const FORMS=[{"id":"f1","title":"Solicitação de TI","subtitle":"Informe os dados da solicitação.","fileName":"Solicitacao_TI","responseMode":"individual","sessionMode":"one","sections":[{"id":"s1","name":"Solicitante","description":"Dados de contato"},{"id":"s2","name":"Solicitação","description":"Detalhes do atendimento"}],"fields":[{"id":"q1","label":"Nome","type":"text","placeholder":"Digite o nome","required":true,"options":[],"sectionId":"s1"},{"id":"q2","label":"Setor","type":"text","placeholder":"","required":true,"options":[],"sectionId":"s1"},{"id":"q3","label":"Descrição","type":"textarea","placeholder":"Descreva o problema","required":true,"options":[],"sectionId":"s2"}],"folderId":null},{"id":"f2","title":"Inspeção de equipamento","subtitle":"Preencha os dados de inspeção.","fileName":"Inspecao","responseMode":"individual","sessionMode":"all","sections":[{"id":"s3","name":"Equipamento","description":"Identificação e condição"}],"fields":[{"id":"q4","label":"Patrimônio","type":"text","placeholder":"","required":true,"options":[],"sectionId":"s3"},{"id":"q5","label":"Condição","type":"select","placeholder":"","required":true,"options":["Bom","Regular","Ruim"],"sectionId":"s3"}],"folderId":null},{"id":"fmumx16d27y1s","title":"Novo formulário","subtitle":"Preencha os campos abaixo.","fileName":"Formulario","responseMode":"all","sessionMode":"all","sections":[{"id":"smumx16d2rwdt","name":"Sessão 1","description":""}],"fields":[],"folderId":null}],FOLDERS=[],FOLDERS_OPEN=true,app=document.getElementById('app');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slug(v){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase()}function showHome(){const folderBlocks=FOLDERS.map(folder=>{const list=FORMS.filter(f=>f.folderId===folder.id);return '<details class="folder-choice"'+(FOLDERS_OPEN?' open':'')+'><summary>▰ '+esc(folder.name)+' · '+list.length+' formulário(s)</summary><div class="form-grid">'+list.map(card).join('')+'</div></details>'}).join(''),loose=FORMS.filter(f=>!f.folderId);app.innerHTML='<h2 class="selector-title">Formulários disponíveis</h2><p class="selector-sub">Abra uma pasta ou escolha um formulário solto.</p><div class="form-grid">'+folderBlocks+(loose.length?'<div class="loose-title">Formulários soltos</div>'+loose.map(card).join(''):'')+'</div>'}function card(f){return '<button class="form-choice" onclick="openForm(\''+f.id+'\')"><strong>'+esc(f.title)+'</strong><span>'+esc(f.subtitle)+'<br>'+f.fields.length+' pergunta(s)</span></button>'}function ctl(q,i){const id='q_'+i+'_'+slug(q.label),req=q.required?' required':'',ph=q.placeholder?' placeholder="'+esc(q.placeholder)+'"':'';if(q.type==='textarea')return '<textarea id="'+id+'"'+ph+req+'></textarea>';if(q.type==='select')return '<select id="'+id+'"'+req+'><option value="">Selecione</option>'+q.options.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';if(q.type==='radio'||q.type==='checkbox')return q.options.map((o,j)=>'<label class="opt"><input type="'+q.type+'" name="'+id+'" value="'+esc(o)+'"'+(q.required&&j===0?' required':'')+'>'+esc(o)+'</label>').join('');return '<input id="'+id+'" type="'+q.type+'"'+ph+req+'>'}window.openForm=id=>{const f=FORMS.find(x=>x.id===id);let groups=[];if(f.responseMode==='individual')groups=f.fields.map((q,i)=>({title:q.label,description:'',items:[{...q,index:i}]}));else if(f.sessionMode==='one')groups=f.sections.map(s=>({title:s.name,description:s.description,items:f.fields.map((q,i)=>({...q,index:i})).filter(q=>q.sectionId===s.id)})).filter(g=>g.items.length);else groups=[{title:'',description:'',items:f.fields.map((q,i)=>({...q,index:i}))}];app.innerHTML='<button class="back-home" type="button">← Outros formulários</button><h2>'+esc(f.title)+'</h2><p class="selector-sub">'+esc(f.subtitle)+'</p><form id="form"><div class="progress"><div id="bar" class="bar"></div></div><div id="counter" class="counter"></div><div id="screens">'+groups.map(g=>'<div class="screen">'+(g.title?'<h3 class="section-title">'+esc(g.title)+'</h3>':'')+(g.description?'<p class="desc">'+esc(g.description)+'</p>':'')+g.items.map(q=>'<div class="field"><label>'+esc(q.label)+(q.required?' *':'')+'</label>'+ctl(q,q.index)+'</div>').join('')+'</div>').join('')+'</div><div class="actions"><button type="button" id="back" class="secondary">Voltar</button><button type="button" id="next" class="primary">Próximo</button></div><div id="status" class="status"></div></form>';app.querySelector('.back-home').onclick=showHome;let cur=0;const form=app.querySelector('#form'),bar=app.querySelector('#bar'),counter=app.querySelector('#counter'),back=app.querySelector('#back'),next=app.querySelector('#next'),status=app.querySelector('#status');function show(){app.querySelectorAll('.screen').forEach((x,i)=>x.classList.toggle('active',i===cur));back.style.visibility=cur?'visible':'hidden';next.textContent=cur===groups.length-1?'Compartilhar planilha':'Próximo';bar.style.width=((cur+1)/groups.length*100)+'%';counter.textContent=groups.length>1?'Etapa '+(cur+1)+' de '+groups.length:''}function valid(){for(const el of app.querySelector('.screen.active').querySelectorAll('input,select,textarea'))if(!el.checkValidity()){el.reportValidity();return false}return true}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}async function share(){const rows=f.fields.map((q,i)=>{const qid='q_'+i+'_'+slug(q.label);const val=q.type==='radio'||q.type==='checkbox'?[...app.querySelectorAll('[name="'+qid+'"]:checked')].map(x=>x.value).join(', '):app.querySelector('#'+qid)?.value||'';return[f.sections.find(s=>s.id===q.sectionId)?.name||'',q.label,val]});const content='\uFEFFSessão;Campo;Resposta\r\n'+rows.map(r=>r.map(csv).join(';')).join('\r\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),file=new File([blob],slug(f.fileName)+'_'+new Date().toISOString().slice(0,10)+'.csv',{type:'text/csv'});try{if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[file]}))throw Error('Navegador sem suporte ao compartilhamento.');await navigator.share({files:[file]});status.textContent='Arquivo entregue ao aplicativo escolhido.';status.className='status ok'}catch(e){status.textContent=e.name==='AbortError'?'Compartilhamento cancelado.':'Falha: '+(e.message||e);status.className='status '+(e.name==='AbortError'?'warn':'error')}}back.onclick=()=>{if(cur){cur--;show()}};next.onclick=async()=>{if(!valid())return;if(cur<groups.length-1){cur++;show()}else await share()};show()};showHome();</script></body></html>
